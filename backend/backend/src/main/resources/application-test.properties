# Perfil temporário de teste sem PostgreSQL

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:oficina_teste;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Não executar migrations PostgreSQL no banco H2
spring.flyway.enabled=false

# Criar tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Credenciais locais de teste
app.admin.login=admin@oficina.local
app.admin.password=12345
