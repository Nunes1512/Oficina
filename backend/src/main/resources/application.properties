spring.application.name=oficina-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ALTERE_AQUI}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:ALTERE_ESTA_CHAVE_POR_UMA_CHAVE_SECRETA_LOCAL_DE_PELO_MENOS_32_CARACTERES}
app.jwt.expiration-ms=3600000

# Admin Master
app.admin.login=${ADMIN_LOGIN:admin@oficina.local}
app.admin.password=${ADMIN_PASSWORD:12345}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html