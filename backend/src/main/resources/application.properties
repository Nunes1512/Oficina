spring.application.name=oficina-api

spring.datasource.url=jdbc:postgresql://localhost:5432/oficina
spring.datasource.username=postgres
spring.datasource.password=ALTERE_AQUI

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Use uma chave aleatória local com pelo menos 32 caracteres. Não publique segredos.
app.jwt.secret=ALTERE_ESTA_CHAVE_POR_UMA_CHAVE_SECRETA_LOCAL_DE_PELO_MENOS_32_CARACTERES
app.jwt.expiration-ms=3600000

# O login inicial é um e-mail. Configure uma senha local forte para criar o Admin Master.
app.admin.login=admin@oficina.local
app.admin.password=ALTERE_AQUI

springdoc.swagger-ui.path=/swagger-ui.html
